bundle:
  name: nyctaxi_demo

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog the ingest/train tasks read and write
    default: ctl_training_dev
  rmse_threshold:
    description: Max acceptable RMSE for a freshly trained model to be promoted
    default: "5.0"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-1502583690645883.3.azuredatabricks.net
    variables:
      catalog: ctl_training_dev
