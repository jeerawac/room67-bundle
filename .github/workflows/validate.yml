# Validates databricks.yml (and resources/*.yml) against the dev target on
# every pull request, so a broken bundle is caught before merge rather than
# at deploy time.
name: Validate bundle

on:
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - uses: actions/checkout@v4

      - name: Install the Databricks CLI
        uses: databricks/setup-cli@v1.13.0

      - name: Validate against the dev target
        run: databricks bundle validate -t dev
